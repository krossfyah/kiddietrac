<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7C3AED">
<title>Set your password — Kiddietrac</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px; position: relative; overflow: hidden;
    background:
      radial-gradient(1100px 620px at 12% 8%, rgba(124,58,237,0.30), transparent 60%),
      radial-gradient(1000px 560px at 88% 92%, rgba(59,187,190,0.28), transparent 60%),
      linear-gradient(135deg, #0E2236 0%, #1F6080 55%, #2A7AA6 100%);
  }
  /* refined, slow-drifting orbs for depth (no clutter) */
  .orb { position: absolute; border-radius: 50%; filter: blur(8px); opacity: .16; animation: drift 16s ease-in-out infinite; }
  @keyframes drift { 0%,100%{ transform: translate(0,0) } 50%{ transform: translate(0,-30px) } }
  .card {
    position: relative; z-index: 2; background: #FFFFFF; width: 100%; max-width: 470px;
    border-radius: 22px; padding: 40px 40px 30px;
    box-shadow: 0 30px 70px rgba(8,22,40,0.35), 0 2px 0 rgba(255,255,255,0.4) inset;
    animation: pop .42s cubic-bezier(.22,1.2,.36,1);
  }
  @keyframes pop { from{ transform: translateY(10px); opacity:0 } to{ transform: translateY(0); opacity:1 } }
  .logo { display:block; height: 56px; max-width: 230px; object-fit: contain; margin: 0 auto 22px; }
  h1 { font-size: 23px; margin-bottom: 6px; text-align:center; color:#0F172A; }
  .subtitle { color: #6B7280; margin-bottom: 22px; font-size: 14px; text-align:center; }
  label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 6px; color:#334155; }
  .field { position: relative; margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 44px 12px 14px; border: 1.5px solid #E2E8F0; border-radius: 11px;
    font-size: 16px; font-family: inherit;
  }
  input:focus { outline: none; border-color: #7C3AED; box-shadow: 0 0 0 3px rgba(124,58,237,0.15); }
  .reveal { position:absolute; right:10px; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; font-size:17px; opacity:.6; width:auto; padding:4px; }
  .suggest { background:none; border:none; color:#7C3AED; font-weight:700; font-size:12px; cursor:pointer; padding:4px 0; margin:2px 0 10px; }
  .meter { height:7px; border-radius:4px; background:#EEF0F4; overflow:hidden; margin:8px 0 6px; }
  .meter > div { height:100%; width:0; border-radius:4px; transition: width .25s, background .25s; }
  .meter-label { font-size:12px; font-weight:700; margin-bottom:12px; min-height:16px; }
  .reqs { list-style:none; font-size:12px; color:#94A3B8; margin:0 0 14px; display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; }
  .reqs li.ok { color:#16A34A; }
  .reqs li::before { content:'○ '; }
  .reqs li.ok::before { content:'✓ '; }
  button.primary {
    width: 100%; padding: 14px; background: linear-gradient(135deg,#7C3AED,#2D7BA8); color: white;
    border: none; border-radius: 11px; font-weight: 700; font-size: 16px; cursor: pointer;
  }
  button.primary:hover { filter: brightness(1.05); }
  button.primary:disabled { opacity: 0.55; cursor: not-allowed; }
  .status { min-height: 22px; padding: 8px 0; font-size: 13px; text-align:center; }
  .status.success { color: #16A34A; }
  .status.error { color: #DC2626; }
  .powered { text-align:center; margin-top:18px; font-size:11px; color:#94A3B8; }
  .powered img { height:14px; vertical-align:middle; opacity:.7; margin-left:3px; }
</style>
</head>
<body>
  <div class="orb" style="width:340px;height:340px;background:#7C3AED;top:-90px;left:-70px;animation-delay:0s;"></div>
  <div class="orb" style="width:300px;height:300px;background:#3BBBBE;bottom:-90px;right:-60px;animation-delay:4s;"></div>
  <div class="orb" style="width:180px;height:180px;background:#2D7BA8;top:34%;right:10%;animation-delay:2s;"></div>

  <div class="card">
    <img class="logo" id="brand-logo" src="/logo-wordmark-large.png" alt="Kiddietrac"
         onerror="this.onerror=null;this.src='/logo-wordmark@2x.png';">
    <h1>Set your password 🎉</h1>
    <p class="subtitle">Welcome aboard! Pick a strong password to finish setting up your account.</p>

    <form id="reset-form" onsubmit="return false;">
      <label for="password">New password</label>
      <div class="field">
        <input type="password" id="password" autocomplete="new-password" required>
        <button type="button" class="reveal" id="reveal1" title="Show / hide">👁</button>
      </div>
      <button type="button" class="suggest" id="suggest">✨ Suggest a strong password</button>
      <div class="meter"><div id="meter-bar"></div></div>
      <div class="meter-label" id="meter-label"></div>
      <ul class="reqs">
        <li id="r-len">8+ characters</li>
        <li id="r-upper">An uppercase letter</li>
        <li id="r-num">A number</li>
        <li id="r-spec">A special character</li>
      </ul>

      <label for="confirm">Confirm password</label>
      <div class="field">
        <input type="password" id="confirm" autocomplete="new-password" required>
        <button type="button" class="reveal" id="reveal2" title="Show / hide">👁</button>
      </div>

      <div class="status" id="status"></div>
      <button type="submit" class="primary" id="submit-btn">Set password & sign in</button>
    </form>

    <div class="powered">Powered by <img src="/logo-wordmark.png" alt="Kiddietrac" onerror="this.replaceWith(document.createTextNode('Kiddietrac'))"></div>
  </div>

<script>
  var API = 'https://api.kiddietrac.com/api/v1';
  var params = new URLSearchParams(window.location.search);
  var token = params.get('token');
  var status = document.getElementById('status');
  var form = document.getElementById('reset-form');
  var submitBtn = document.getElementById('submit-btn');
  var pw = document.getElementById('password');
  var cf = document.getElementById('confirm');

  // Keep the Kiddietrac wordmark on the set-password page (the invite is a
  // Kiddietrac/platform email). We only refresh the page title from branding.
  fetch(API + '/branding').then(function (r) { return r.json(); }).then(function (b) {
    if (b && b.branding && b.branding.product_name) document.title = 'Set your password — ' + b.branding.product_name;
  }).catch(function () {});

  if (!token) {
    status.className = 'status error';
    status.textContent = 'No invite token in the link. Please use the link from your email.';
    submitBtn.disabled = true;
  }

  // Reveal toggles
  function toggle(inp, btn) { btn.addEventListener('click', function () { inp.type = inp.type === 'password' ? 'text' : 'password'; }); }
  toggle(pw, document.getElementById('reveal1'));
  toggle(cf, document.getElementById('reveal2'));

  // Requirements + strength
  function checks(v) {
    return { len: v.length >= 8, upper: /[A-Z]/.test(v), num: /[0-9]/.test(v), spec: /[^A-Za-z0-9]/.test(v) };
  }
  function strength(v) {
    if (!v) return { pct: 0, label: '', color: '#EEF0F4' };
    var c = checks(v), score = 0;
    if (c.len) score++; if (c.upper) score++; if (c.num) score++; if (c.spec) score++;
    if (v.length >= 12) score++;
    var map = [
      { pct: 18, label: 'Too weak', color: '#DC2626' },
      { pct: 38, label: 'Weak', color: '#F59E0B' },
      { pct: 60, label: 'Fair', color: '#F59E0B' },
      { pct: 80, label: 'Good', color: '#3BBBBE' },
      { pct: 100, label: 'Strong 💪', color: '#16A34A' },
    ];
    return map[Math.min(score, 5) - 1] || map[0];
  }
  function refresh() {
    var v = pw.value, c = checks(v), s = strength(v);
    document.getElementById('meter-bar').style.width = s.pct + '%';
    document.getElementById('meter-bar').style.background = s.color;
    var lbl = document.getElementById('meter-label'); lbl.textContent = s.label; lbl.style.color = s.color;
    [['r-len','len'],['r-upper','upper'],['r-num','num'],['r-spec','spec']].forEach(function (p) {
      document.getElementById(p[0]).className = c[p[1]] ? 'ok' : '';
    });
  }
  pw.addEventListener('input', refresh);

  // Strong-password generator: upper + lower + number + special, 12 chars.
  document.getElementById('suggest').addEventListener('click', function () {
    var U = 'ABCDEFGHJKLMNPQRSTUVWXYZ', L = 'abcdefghijkmnpqrstuvwxyz', N = '23456789', S = '!@#$%^&*?-+';
    var all = U + L + N + S, out = [
      U[Math.floor(Math.random()*U.length)], L[Math.floor(Math.random()*L.length)],
      N[Math.floor(Math.random()*N.length)], S[Math.floor(Math.random()*S.length)]
    ];
    for (var i = 0; i < 8; i++) out.push(all[Math.floor(Math.random()*all.length)]);
    for (var j = out.length - 1; j > 0; j--) { var k = Math.floor(Math.random()*(j+1)); var t = out[j]; out[j] = out[k]; out[k] = t; }
    var p = out.join('');
    pw.value = p; cf.value = p; pw.type = 'text'; cf.type = 'text'; refresh();
    status.className = 'status'; status.textContent = 'Suggested a strong password — save it somewhere safe.';
  });

  form.addEventListener('submit', async function (e) {
    e.preventDefault();
    var password = pw.value, confirm = cf.value, c = checks(password);
    if (!c.len || !c.upper || !c.num || !c.spec) {
      status.className = 'status error';
      status.textContent = 'Password needs 8+ characters with an uppercase letter, a number, and a special character.';
      return;
    }
    if (password !== confirm) { status.className = 'status error'; status.textContent = 'Passwords do not match.'; return; }
    submitBtn.disabled = true; submitBtn.textContent = 'Setting up…';
    status.className = 'status'; status.textContent = '';
    try {
      var res = await fetch(API + '/auth/set-password', {
        method: 'POST', headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ token: token, password: password }),
      });
      var result = await res.json();
      if (!res.ok) throw new Error(result.message || 'Could not set password.');
      status.className = 'status success';
      status.textContent = '✓ All set — signing you in…';
      if (result.token) { sessionStorage.setItem('kt_token', result.token); localStorage.setItem('kt_token', result.token); }
      if (result.user) {
        sessionStorage.setItem('kt_user', JSON.stringify(result.user));
        localStorage.setItem('kt_user', JSON.stringify(result.user));
        if (result.user.agency_id) sessionStorage.setItem('kt_active_agency_id', String(result.user.agency_id));
      }
      setTimeout(function () { window.location.href = result.token ? '/dashboard.html' : '/'; }, 1200);
    } catch (err) {
      status.className = 'status error';
      status.textContent = '✗ ' + err.message;
      submitBtn.disabled = false; submitBtn.textContent = 'Set password & sign in';
    }
  });
</script>
</body>
</html>
