<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1F6080">
<title>Set your password — Kiddietrac</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/css/mobile-v11.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: linear-gradient(135deg, #1F6080 0%, #2c7894 100%);
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    background: white; width: 100%; max-width: 440px;
    border-radius: 20px; padding: 40px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.2);
  }
  .brand-name { font-size: 24px; font-weight: 800; color: #1F6080; text-align: center; margin-bottom: 24px; }
  h1 { font-size: 24px; margin-bottom: 8px; }
  .subtitle { color: #6B7280; margin-bottom: 24px; font-size: 15px; }
  label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
  input {
    width: 100%; padding: 12px 14px; margin-bottom: 16px;
    border: 1px solid #D1D5DB; border-radius: 10px;
    font-size: 16px; font-family: inherit;
  }
  input:focus { outline: none; border-color: #1F6080; box-shadow: 0 0 0 3px rgba(31,96,128,0.15); }
  button {
    width: 100%; padding: 14px;
    background: #1F6080; color: white;
    border: none; border-radius: 10px;
    font-weight: 700; font-size: 16px; cursor: pointer;
  }
  button:hover { background: #154055; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .status { min-height: 24px; padding: 8px 0; font-size: 14px; }
  .status.success { color: #16A34A; }
  .status.error { color: #DC2626; }
</style>
</head>
<body>
  <div class="card">
    <div class="brand-name" id="brand-name">Kiddietrac</div>
    <h1>Set your password</h1>
    <p class="subtitle">Welcome! Pick a strong password to finish setting up your account.</p>

    <form id="reset-form" onsubmit="return false;">
      <label for="password">New password</label>
      <input type="password" id="password" required minlength="8">
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" required minlength="8">
      <div class="status" id="status"></div>
      <button type="submit" id="submit-btn">Set password & sign in</button>
    </form>
  </div>

<script>
  // Apply branding from query string or load from API
  fetch('https://api.kiddietrac.com/api/v1/branding')
    .then(r => r.json())
    .then(b => {
      if (b && b.branding && b.branding.product_name) {
        document.getElementById('brand-name').textContent = b.branding.product_name;
        document.title = 'Set your password — ' + b.branding.product_name;
      }
    }).catch(() => {});

  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const status = document.getElementById('status');
  const form = document.getElementById('reset-form');
  const submitBtn = document.getElementById('submit-btn');

  if (!token) {
    status.className = 'status error';
    status.textContent = 'No reset token in URL. Please use the link from your email.';
    submitBtn.disabled = true;
  }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    if (password !== confirm) {
      status.className = 'status error';
      status.textContent = 'Passwords do not match.';
      return;
    }
    submitBtn.disabled = true;
    submitBtn.textContent = 'Setting password...';
    status.className = 'status'; status.textContent = '';

    try {
      const res = await fetch('https://api.kiddietrac.com/api/v1/auth/reset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ token: token, password: password, password_confirmation: confirm }),
      });
      const result = await res.json();
      if (!res.ok) throw new Error(result.message || 'Reset failed');

      status.className = 'status success';
      status.textContent = '✓ Password set. Redirecting to sign in...';

      if (result.token) {
        sessionStorage.setItem('kt_token', result.token);
        localStorage.setItem('kt_token', result.token);
      }
      if (result.user) {
        sessionStorage.setItem('kt_user', JSON.stringify(result.user));
        localStorage.setItem('kt_user', JSON.stringify(result.user));
      }
      setTimeout(() => window.location.href = result.token ? '/dashboard.html' : '/', 1500);
    } catch (e) {
      status.className = 'status error';
      status.textContent = '✗ ' + e.message;
      submitBtn.disabled = false;
      submitBtn.textContent = 'Set password & sign in';
    }
  });
</script>
</body>
</html>
