  <style>
    :root { --brand: #1F6080; --ink: #0F172A; --muted: #64748B; --line: #E2E8F0; --bg: #F4F8FB; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    .wrap { max-width: 520px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 48px; }
    .head { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 6px 0 18px; min-height: 40px; }
    .head img { max-height: 40px; max-width: 200px; }
    .head b { font-size: 17px; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px 22px; box-shadow: 0 18px 40px -28px rgba(15, 23, 42, .35); }
    .eyebrow { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--brand); }
    h1 { font-size: 22px; line-height: 1.25; margin: 6px 0 6px; }
    .sub { font-size: 14.5px; color: #334155; line-height: 1.55; margin: 0 0 14px; }
    .facts { display: grid; gap: 8px; background: #F8FAFC; border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font-size: 14.5px; }
    .facts div { display: flex; justify-content: space-between; gap: 12px; }
    .facts span { color: var(--muted); }
    .facts .auto { color: #B45309; font-weight: 700; }
    label { display: block; font-size: 14px; font-weight: 800; margin: 18px 0 6px; }
    .help { font-size: 12.5px; color: var(--muted); margin-top: 5px; }
    input[type=time] { width: 100%; font-size: 22px; font-weight: 700; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; font-family: inherit; color: var(--ink); background: #fff; }
    textarea { width: 100%; min-height: 76px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 15px; font-family: inherit; resize: vertical; }
    input:focus, textarea:focus { outline: none; border-color: var(--brand); }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .btn { display: block; width: 100%; margin-top: 18px; border: 0; border-radius: 12px; padding: 15px; font-size: 16px; font-weight: 800; color: #fff; background: var(--brand); cursor: pointer; font-family: inherit; }
    .btn.ghost { background: #fff; color: var(--ink); border: 1.5px solid var(--line); margin-top: 10px; }
    .btn:disabled { opacity: .6; cursor: default; }
    .err { color: #B91C1C; font-weight: 700; font-size: 13.5px; min-height: 18px; margin-top: 10px; }
    .done { text-align: center; padding: 8px 0; }
    .done .big { font-size: 52px; line-height: 1; margin-bottom: 10px; }
    .confirm { background: #F0F9FF; border: 1px solid #BAE6FD; border-radius: 12px; padding: 12px 14px; font-size: 14.5px; color: #075985; margin-top: 14px; line-height: 1.5; }
    .foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 16px; }
    @media (min-width: 700px) { .wrap { padding-top: 48px; } .card { padding: 28px 30px; } h1 { font-size: 25px; } }
  </style>
</head>

    }
    var head = document.getElementById('head');
    head.innerHTML = b.logo ? '<img alt="' + esc(b.name) + '">' : '<b>' + esc(b.name) + '</b>';
    if (b.logo) { head.firstChild.src = b.logo; head.firstChild.onerror = function () { head.innerHTML = '<b>' + esc(b.name) + '</b>'; }; }
    var f = document.getElementById('fav'); if (f && b.favicon) { f.href = b.favicon; }
    document.getElementById('foot').textContent = b.name;
    document.title = tr('Enter the real time') + ' · ' + b.name;
  }
  function fail(msg) {
    app.innerHTML = '<div class="done"><div class="big">🔗</div><h1>' + esc(tr('This link can’t be used')) + '</h1><p class="sub">' + esc(trMsg(msg)) + '</p></div>';
  }
  function load() {
    if (token.length < 30) { brand({ name: 'KiddieTrac' }); return fail(tr('This link is not complete. Please open it again from your email.')); }
    fetch(API + token, { headers: { Accept: 'application/json' } })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && TR[d.locale]) { LOC = d.locale; } else if (d && d.locale === 'en') { LOC = 'en'; }
        setLang();
        brand(d.brand || { name: 'KiddieTrac' });
        if (d.state !== 'ok') { return fail(d.message || tr('This link is not available.')); }
        D = d; paint();
      })
      .catch(function () { brand({ name: 'KiddieTrac' }); fail(tr('We could not reach the server. Please check your connection and try again.')); });
  }
  function paint() {
    var child = D.kind === 'child';
    app.innerHTML = ''
      + '<div class="eyebrow">' + (child ? tr('Attendance') : tr('Time clock')) + '</div>'
      + '<h1>' + (child ? tr('When did you pick up {1}?', esc(D.who)) : tr('When did you clock out?')) + '</h1>'
      + '<p class="sub">' + (child
          ? tr('No sign-out was recorded, so our system filled in a time automatically. Enter the time you actually picked up and the record is updated straight away.')
          : tr('No clock-out was recorded, so your shift was closed automatically. Enter the time you actually left and your timesheet is updated straight away.')) + '</p>'
      + '<div class="facts">'
      + '<div><span>' + tr('Date') + '</span><b>' + esc(dateLabel()) + '</b></div>'
      + '<div><span>' + (child ? tr('Centre') : tr('Location')) + '</span><b>' + esc(D.centre) + '</b></div>'
      + '<div><span>' + (child ? tr('Signed in') : tr('Clocked in')) + '</span><b>' + esc(D.in_label) + '</b></div>'
      + '<div><span>' + tr('Automatic time') + '</span><b class="auto">' + esc(D.auto_label) + '</b></div>'
      + '</div>'
      + '<form id="f" novalidate>'
      + '<label for="tm">' + (child ? tr('Actual pick-up time') : tr('Actual clock-out time')) + '</label>'
      + '<input type="time" id="tm" required min="' + esc(D.min) + '" max="' + esc(D.max) + '" step="60">'
      + '<div class="help">' + tr('Between {1} and {2} on {3} (centre time).', esc(fmt12(D.min)), esc(fmt12(D.max)), esc(dateLabel())) + '</div>'
      + '<label for="nt">' + tr('Note') + ' <span style="font-weight:500;color:#64748B">' + tr('(optional)') + '</span></label>'
      + '<textarea id="nt" maxlength="280" placeholder="' + (child ? tr('e.g. Grandma picked up') : tr('e.g. Forgot to clock out at the end of the day')) + '"></textarea>'
      + '<div class="hp"><label>Website <input id="hp" tabindex="-1" autocomplete="off"></label></div>'
      + '<div class="err" id="err"></div>'
      + '<button class="btn" type="submit" id="go">' + tr('Continue') + '</button>'
      + '</form>';
    document.getElementById('f').onsubmit = function (ev) {
      ev.preventDefault();
      var t = document.getElementById('tm').value;
      var err = document.getElementById('err');
      if (!t) { err.textContent = tr('Please choose a time.'); return; }
      if (t <= D.min) { err.textContent = tr(child ? 'That is before the sign-in at {1}.' : 'That is before the clock-in at {1}.', D.in_label); return; }
      if (t > D.max) { err.textContent = tr('That is after the automatic time.'); return; }
      confirmStep(t, document.getElementById('nt').value, document.getElementById('hp').value);
    };
  }
  function confirmStep(t, note, hp) {
    var child = D.kind === 'child';
    app.innerHTML = '<div class="eyebrow">' + tr('Please check') + '</div><h1>' + tr(child ? 'Picked up at {1}?' : 'Clocked out at {1}?', esc(fmt12(t))) + '</h1>'
      + '<div class="confirm">' + esc(dateLabel()) + ' · ' + esc(D.centre) + (note ? '<br>' + tr('Note:') + ' ' + esc(note) : '') + '<br><br>'
      + (child ? tr('This replaces the automatic time and the centre is told.') : tr('This replaces the automatic time on your timesheet and your director is told.')) + '</div>'
      + '<div class="err" id="err"></div>'
      + '<button class="btn" type="button" id="ok">' + tr('Yes, that’s right') + '</button>'
      + '<button class="btn ghost" type="button" id="back">' + tr('Change it') + '</button>';
    document.getElementById('back').onclick = paint;
    document.getElementById('ok').onclick = function () {
      var b = this; b.disabled = true; b.textContent = tr('Saving…');
      fetch(API + token, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ time: t, note: note || null, website: hp || null }) })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (!res.ok) { b.disabled = false; b.textContent = tr('Yes, that’s right'); document.getElementById('err').textContent = trMsg((res.j && res.j.message) || tr('That could not be saved.')); return; }
          app.innerHTML = '<div class="done"><div class="big">✅</div><h1>' + tr('Thank you!') + '</h1><p class="sub">' + esc(trMsg(res.j.message)) + '</p>'
            + '<p class="sub" style="color:#64748B;font-size:13px">' + tr('You can close this page.') + '</p></div>';
        })
        .catch(function () { b.disabled = false; b.textContent = tr('Yes, that’s right'); document.getElementById('err').textContent = tr('We could not reach the server. Please try again.'); });
    };
  }
  load();
})();
</script>
