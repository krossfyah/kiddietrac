<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="kt-fav-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F6080"/>
      <stop offset="100%" stop-color="#2C8AAC"/>
    </linearGradient>
  </defs>
  <!-- Rounded background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#kt-fav-bg)"/>
  <!-- Subtle highlight at top -->
  <rect x="2" y="2" width="60" height="22" rx="14" fill="white" opacity="0.08"/>
  <!-- "K" lettering -->
  <text x="32" y="46" font-family="system-ui,-apple-system,'Segoe UI',sans-serif"
        font-weight="900" font-size="40" fill="white" text-anchor="middle"
        letter-spacing="-1">K</text>
  <!-- Accent dot (KT green) -->
  <circle cx="50" cy="14" r="5" fill="#8EC73C"/>
  <circle cx="50" cy="14" r="2" fill="white" opacity="0.4"/>
</svg>
