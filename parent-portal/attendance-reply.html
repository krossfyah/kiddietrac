    .st-absent { color: var(--warn); }

    .btn { display: block; width: 100%; border: 0; border-radius: 12px; padding: 14px 10px; font-size: 15.5px; font-weight: 800; color: #fff; background: var(--brand); cursor: pointer; font-family: inherit; }

    .done { text-align: center; padding: 6px 0 2px; }
    .done .big { font-size: 48px; line-height: 1; margin-bottom: 8px; }
    .foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 16px; }
    /* The popup: a glass backdrop, the one popup header (navy-to-teal band + teal line), the ✕ inside it. */
    .ov { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 16px;
          background: rgba(15, 23, 42, .38); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    .pop { width: 100%; max-width: 440px; max-height: calc(100vh - 32px); display: flex; flex-direction: column; overflow: hidden;
           background: var(--card); border-radius: 18px; box-shadow: 0 30px 70px -20px rgba(2, 6, 23, .55); }
    .pop-h { position: relative; padding: 15px 52px 15px 18px; color: #fff; font-weight: 800; font-size: 16.5px;

    .pop-x { position: absolute; top: 50%; right: 10px; transform: translateY(-50%); width: 32px; height: 32px; border: 0; border-radius: 8px;
             background: rgba(255, 255, 255, .14); color: #fff; font-size: 16px; cursor: pointer; }
    .pop-b { padding: 16px 18px 18px; overflow-y: auto; }
    label { display: block; font-size: 14px; font-weight: 800; margin: 14px 0 6px; }
    label:first-child { margin-top: 0; }
    .opt { font-weight: 500; color: var(--muted); }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { border: 1.5px solid var(--line); background: var(--field); color: var(--ink); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .chip[aria-pressed="true"] { border-color: var(--brand); background: var(--brand); color: #fff; }
    input[type=time] { width: 100%; font-size: 22px; font-weight: 700; padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 12px; font-family: inherit; color: var(--ink); background: var(--field); color-scheme: light dark; }
    textarea { width: 100%; min-height: 76px; padding: 10px 12px; border: 1.5px solid var(--line); border-radius: 12px; font-size: 15px; font-family: inherit; resize: vertical; color: var(--ink); background: var(--field); }
    input:focus, textarea:focus, .chip:focus-visible, .btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }

    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 16px; }
    @media (min-width: 700px) { .wrap { padding-top: 48px; } .card { padding: 28px 30px; } h1 { font-size: 25px; } }

  function trMsg(m) {
    m = String(m || '');
    if (LOC === 'en' || !TR[LOC]) { return m; }
    if (TR[LOC][m]) { return TR[LOC][m]; }
    for (var k in TR[LOC]) {
      if (k.indexOf('{1}') === -1) { continue; }
      var order = [];
      var rx = new RegExp('^' + k.split(/(\{\d\})/).map(function (x) {
        var ph = /^\{(\d)\}$/.exec(x);
        if (ph) { if (order.indexOf(ph[1]) > -1) { return '(?:.+?)'; } order.push(ph[1]); return '(.+?)'; }
        return x.replace(/[.*+?^$()|[\]\\{}]/g, '\\$&');
      }).join('') + '$');
      var hit = rx.exec(m);
      if (hit) {
        var vals = {}; order.forEach(function (n, i) { vals[n] = hit[i + 1]; });
        return TR[LOC][k].replace(/\{(\d)\}/g, function (_, n) { return vals[n] || ''; });
      }
    }
    return m;
  }
  function setLang() {
    document.documentElement.lang = BCP[LOC] || 'en-CA';
    if (app.textContent === 'Loading…') { app.textContent = tr('Loading…'); }
  }
  setLang();
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function fmt12(hhmm) {
    var p = String(hhmm || '').split(':'); var h = +p[0]; var m = p[1] || '00';
    return (((h + 11) % 12) + 1) + ':' + m + ' ' + (h < 12 ? 'AM' : 'PM');
  }
  function dateLabel() {
    if (LOC === 'en' || !D.date) { return D.date_label; }
    try { return new Date(D.date + 'T12:00:00').toLocaleDateString(BCP[LOC], { weekday: 'long', month: 'long', day: 'numeric' }); } catch (e) { return D.date_label; }
  }
  function brand(b) {
    b = b || { name: 'KiddieTrac' };
    var hex = String(b.primary || '').replace('#', '');
    if (/^[0-9a-fA-F]{6}$/.test(hex)) {
      var ch = [0, 2, 4].map(function (i) { var v = parseInt(hex.substr(i, 2), 16) / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
      // Only a colour dark enough to carry white button text replaces the default.
      if (0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2] < 0.3) { document.documentElement.style.setProperty('--brand', '#' + hex); }
    }
    var head = document.getElementById('head');
    head.innerHTML = b.logo ? '<img alt="' + esc(b.name) + '">' : '<b>' + esc(b.name) + '</b>';
    if (b.logo) { head.firstChild.src = b.logo; head.firstChild.onerror = function () { head.innerHTML = '<b>' + esc(b.name) + '</b>'; }; }
    // Favicon: the brand's own; KiddieTrac's only when this is not a white-label agency.
    var f = document.getElementById('fav');
    if (f) { f.href = b.favicon || (b.white_label ? 'data:,' : '/favicon.svg?v=20260901b'); }
    // Who it is from: the agency's own name (2026-11-27, "from agency name"); the logo stays the brand's.
    document.getElementById('foot').textContent = b.from || b.name;
    document.title = tr('Attendance') + ' · ' + (b.from || b.name);
  }
  function fail(msg) {
    app.innerHTML = '<div class="done"><div class="big">🔗</div><h1>' + esc(tr('This link can’t be used')) + '</h1><p class="sub">' + esc(trMsg(msg)) + '</p></div>';
  }
  function load(then) {
    if (token.length < 30) { brand(null); return fail(tr('This link is not complete. Please open it again from your email.')); }
    fetch(API + token, { headers: { Accept: 'application/json' } })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (d && TR[d.locale]) { LOC = d.locale; } else if (d && d.locale === 'en') { LOC = 'en'; }
        setLang();
        brand(d.brand);
        if (d.state !== 'ok') { return fail(d.message); }
        D = d; paint(); if (then) { then(); }
      })
      .catch(function () { brand(null); fail(tr('We could not reach the server. Please check your connection and try again.')); });
  }
  function statusLine() {
    var c = D.current || {};
    if (c.arrived) { return '<b class="st-ok">' + esc(tr('Signed in at {1}', c.arrived)) + '</b>'; }
    if (c.absent) {
      if (c.absent.auto) { return '<b class="st-absent">' + esc(tr('Marked absent by Safe Arrival')) + '</b>'; }
      return '<b class="st-absent">' + esc(tr('Absent')) + (c.absent.reason ? ' · ' + esc(tr(c.absent.reason.charAt(0).toUpperCase() + c.absent.reason.slice(1))) : '') + '</b>';
    }
    if (c.late) { return '<b>' + esc(tr('Running late, here by {1}', c.late.by_label)) + '</b>'; }
    return '<b>' + esc(tr('Not signed in yet')) + '</b>';
  }
  function paint() {
    var c = D.current || {};
    var noShow = c.absent && c.absent.auto;
    app.innerHTML = '<div class="eyebrow">' + esc(tr('Attendance')) + '</div>'
      + '<h1>' + esc(noShow ? tr('We missed {1} today', D.child) : tr('Is {1} coming in today?', D.child)) + '</h1>'
      + '<p class="sub">' + esc(noShow ? tr('{1} wasn’t signed in, so Safe Arrival marked {1} absent. Tell us why, or let us know {1} is on the way.', D.child)
          : tr('{1} hasn’t been signed in yet. Let the team know what’s happening.', D.child)) + '</p>'
      + '<div class="facts">'
      + '<div><span>' + esc(tr('Date')) + '</span><b>' + esc(dateLabel()) + '</b></div>'
      + (D.centre ? '<div><span>' + esc(tr('Centre')) + '</span><b>' + esc(D.centre) + '</b></div>' : '')
      + (D.expected ? '<div><span>' + esc(tr('Expected')) + '</span><b>' + esc(D.expected) + '</b></div>' : '')
      + '<div><span>' + esc(tr('On file now')) + '</span>' + statusLine() + '</div>'
      + '</div>'
      + (c.arrived
        ? '<p class="sub" style="margin:14px 0 0">' + esc(tr('{1} is already signed in today, so there is nothing to change.', D.child)) + '</p>'
        : '<div class="acts"' + (D.can_late ? '' : ' style="grid-template-columns:1fr"') + '>'
          + '<button class="btn abs" type="button" id="bA">' + esc(noShow ? tr('Add a reason') : tr('Mark absent')) + '</button>'
          + (D.can_late ? '<button class="btn" type="button" id="bL">' + esc(noShow ? tr('Running late after all') : tr('Running late')) + '</button>' : '')
          + '</div><div class="help" style="text-align:center;margin-top:10px">' + esc(tr('The centre is told straight away.')) + '</div>');
    var bA = document.getElementById('bA'), bL = document.getElementById('bL');
    if (bA) { bA.onclick = function () { openPop('absent'); }; }
    if (bL) { bL.onclick = function () { openPop('late'); }; }
  }
  var ovl = document.getElementById('ovl');
  var lastFocus = null;
  function closePop() {
    ovl.innerHTML = ''; document.removeEventListener('keydown', onKey);
    if (lastFocus && lastFocus.focus) { lastFocus.focus(); }
  }
  function onKey(e) { if (e.key === 'Escape') { closePop(); } }
  function openPop(kind) {
    var c = D.current || {};
    if (c.arrived) { return; }
    lastFocus = document.activeElement;
    var abs = kind === 'absent';
    var cur = abs ? (c.absent && !c.absent.auto ? c.absent : null) : c.late;
    var title = abs ? tr('Mark {1} absent today', D.child) : tr('{1} is running late', D.child);
    var body = '';
    if (abs) {
      var sel = (cur && cur.reason) || '';
      body += '<label id="lr">' + esc(tr('Reason')) + '</label><div class="chips" role="group" aria-labelledby="lr">'
        + D.reasons.map(function (r) {
          var lbl = r.charAt(0).toUpperCase() + r.slice(1);
          return '<button type="button" class="chip" data-r="' + r + '" aria-pressed="' + (r === sel) + '">' + esc(tr(lbl)) + '</button>';
        }).join('') + '</div>';
    } else {
      body += '<label for="tm">' + esc(tr('Arriving by')) + '</label>'
        + '<input type="time" id="tm" step="60" min="' + esc(D.now) + '" max="23:59" value="' + esc(cur ? cur.by : '') + '">'
        + '<div class="help">' + esc(tr('Today, centre time.')) + '</div>';
    }
    body += '<label for="nt">' + esc(tr('Note')) + ' <span class="opt">' + esc(tr('(optional)')) + '</span></label>'
      + '<textarea id="nt" maxlength="280" placeholder="' + esc(abs ? tr('e.g. Fever since last night') : tr('e.g. Doctor’s appointment first')) + '">' + esc(cur && cur.note ? cur.note : '') + '</textarea>'
      + '<div class="hp"><label>Website <input id="hp" tabindex="-1" autocomplete="off"></label></div>'
      + '<div class="err" id="err" role="alert"></div>'
      + '<div class="row2"><button class="btn ghost" type="button" id="pc">' + esc(tr('Cancel')) + '</button>'
      + '<button class="btn' + (abs ? ' abs' : '') + '" type="button" id="go">' + esc(tr('Send to the centre')) + '</button></div>';
    ovl.innerHTML = '<div class="ov" id="ov"><div class="pop" role="dialog" aria-modal="true" aria-labelledby="pt">'
      + '<div class="pop-h" id="pt">' + esc(title) + '<button class="pop-x" type="button" id="px" aria-label="' + esc(tr('Close')) + '">✕</button></div>'
      + '<div class="pop-b">' + body + '</div></div></div>';
    document.getElementById('ov').addEventListener('click', function (e) { if (e.target.id === 'ov') { closePop(); } });
    document.getElementById('px').onclick = closePop;
    document.getElementById('pc').onclick = closePop;
    document.addEventListener('keydown', onKey);
    [].forEach.call(ovl.querySelectorAll('.chip'), function (b) {
      b.onclick = function () { [].forEach.call(ovl.querySelectorAll('.chip'), function (x) { x.setAttribute('aria-pressed', String(x === b)); }); };
    });
    var first = abs ? ovl.querySelector('.chip') : document.getElementById('tm');
    if (first) { first.focus(); }
    document.getElementById('go').onclick = function () {
      var err = document.getElementById('err'), b = this;
      var payload = { action: kind, note: document.getElementById('nt').value || null, website: document.getElementById('hp').value || null };
      if (abs) {
        var on = ovl.querySelector('.chip[aria-pressed="true"]');
        payload.reason = on ? on.getAttribute('data-r') : 'other';
      } else {
        var t = document.getElementById('tm').value;
        if (!t) { err.textContent = tr('Please choose a time.'); return; }
        if (t <= D.now) { err.textContent = tr('Choose a time later than now.'); return; }
        payload.by = t;
      }
      b.disabled = true; b.textContent = tr('Saving…');
      fetch(API + token, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' }, body: JSON.stringify(payload) })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          if (res.j && res.j.current) { D.current = res.j.current; }
          if (!res.ok) {
            b.disabled = false; b.textContent = tr('Send to the centre');
            err.textContent = trMsg((res.j && res.j.message) || tr('That could not be saved.'));
            return;
          }
          closePop();
          app.innerHTML = '<div class="done"><div class="big">✅</div><h1>' + esc(tr('Thank you!')) + '</h1><p class="sub">' + esc(trMsg(res.j.message)) + '</p>'
            + '<p class="sub" style="color:var(--muted);font-size:13px">' + esc(tr('You can close this page.')) + '</p>'
            + '<button class="btn ghost" type="button" id="again" style="margin-top:6px">' + esc(tr('Change my answer')) + '</button></div>';
          document.getElementById('again').onclick = function () { load(); };
        })
        .catch(function () { b.disabled = false; b.textContent = tr('Send to the centre'); err.textContent = tr('We could not reach the server. Please try again.'); });
    };
  }
  // ?a=absent|late from the email button: open that popup straight away (opening it still changes nothing).
  load(function () { if ((want === 'absent' || want === 'late') && !(D.current || {}).arrived && (want === 'absent' || D.can_late)) { openPop(want); } });
})();
</script>
</body>
</html>
