<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="Play Spark">
  <!-- Play Spark mark (2026-11-24). Same family as One-Tap, Safe Arrival and Walk Watch:
       navy tile (#12307A to #0A1E55, rx 17 on 64), white main shape, KiddieTrac teal (#1DB9C3) spark rays.
       A stack of two play blocks with a four-point spark lighting up over them - an idea, sparked from what is in the room. -->
  <defs>
    <linearGradient id="psg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12307A"/>
      <stop offset="1" stop-color="#0A1E55"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="17" fill="url(#psg)"/>
  <!-- play blocks -->
  <rect x="11" y="38" width="17" height="15" rx="3.5" fill="#fff"/>
  <rect x="30" y="38" width="17" height="15" rx="3.5" fill="#fff" opacity=".92"/>
  <rect x="20.5" y="24" width="17" height="14" rx="3.5" fill="#fff" transform="rotate(-8 29 31)"/>
  <circle cx="19.5" cy="45.5" r="2.4" fill="#1DB9C3"/>
  <circle cx="38.5" cy="45.5" r="2.4" fill="#0A1E55" opacity=".35"/>
  <!-- the spark -->
  <path d="M47 9 C48 15.5 49.5 17 56 18 C49.5 19 48 20.5 47 27 C46 20.5 44.5 19 38 18 C44.5 17 46 15.5 47 9 Z" fill="#1DB9C3"/>
  <circle cx="47" cy="18" r="2.2" fill="#fff"/>
  <!-- three spark rays (the wordmark's ticks) -->
  <path d="M33.5 13.5 L36.5 16.5" stroke="#1DB9C3" stroke-width="3" stroke-linecap="round"/>
  <path d="M47 33 L47 36.5" stroke="#1DB9C3" stroke-width="3" stroke-linecap="round" opacity=".8"/>
  <path d="M55.5 29 L53 26.5" stroke="#1DB9C3" stroke-width="3" stroke-linecap="round" opacity=".6"/>
</svg>
