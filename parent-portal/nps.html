<!DOCTYPE html>
<html lang="en-CA">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Survey</title>
  <meta name="robots" content="noindex">
  <!-- No icon until the brand is known: a white-label agency must not show KiddieTrac's. -->
  <link rel="icon" id="fav" href="data:,">
  <link rel="stylesheet" href="/css/kt-fonts.css?v=20261014net">
  <meta name="theme-color" content="#0A1C3A">
  <!-- NPS survey from the email / bell (2026-11-28). ?t=<token>[&s=0..10]. Backend: NpsController show/answer +
       App\Support\NpsSurvey. Opening the page changes nothing (mail scanners open every link); only Send does. -->
  <style>
    :root { --brand: #1F6080; --ink: #0F172A; --ink2: #334155; --muted: #64748B; --line: #E2E8F0; --bg: #F4F8FB; --card: #FFFFFF; --soft: #F8FAFC; --field: #FFFFFF; --ok: #047857; }
    @media (prefers-color-scheme: dark) {
      :root { --ink: #F1F5F9; --ink2: #CBD5E1; --muted: #94A3B8; --line: #334155; --bg: #0B1220; --card: #111A2E; --soft: #1E293B; --field: #0F172A; --ok: #34D399; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: var(--ink); background: var(--bg); }
    .wrap { max-width: 560px; margin: 0 auto; padding: max(20px, env(safe-area-inset-top)) 16px 48px; }
    .head { display: flex; align-items: center; justify-content: center; gap: 10px; margin: 6px 0 18px; min-height: 40px; }
    .head img { max-height: 40px; max-width: 200px; }
    .head b { font-size: 17px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px; box-shadow: 0 18px 40px -28px rgba(15, 23, 42, .35); }
    .eyebrow { font-size: 11.5px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    h1 { font-size: 20px; line-height: 1.3; margin: 6px 0 14px; }
    .sub { font-size: 14.5px; color: var(--ink2); line-height: 1.55; margin: 0 0 14px; }
    .scale { display: grid; grid-template-columns: repeat(11, 1fr); gap: 5px; }
    .scale button { height: 40px; border-radius: 9px; border: 1px solid var(--line); background: var(--soft); color: var(--ink); font: 800 15px/1 inherit; cursor: pointer; padding: 0; }
    .scale button.on { background: var(--brand); border-color: var(--brand); color: #fff; }
    .ends { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin: 6px 0 16px; }
    label { display: block; font-size: 13.5px; font-weight: 700; margin-bottom: 6px; }
    textarea { width: 100%; min-height: 96px; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font: 14.5px/1.5 inherit; color: var(--ink); background: var(--field); resize: vertical; }
    .send { width: 100%; height: 46px; margin-top: 14px; border: 0; border-radius: 12px; background: var(--brand); color: #fff; font: 800 15.5px/1 inherit; cursor: pointer; }
    .send:disabled { opacity: .55; cursor: default; }
    .msg { font-size: 13.5px; margin-top: 10px; color: #B91C1C; min-height: 1em; }
    .done { text-align: center; padding: 10px 4px; }
    .done .big { font-size: 44px; }
    .hp { position: absolute; left: -9999px; width: 1px; height: 1px; overflow: hidden; }
    .foot { text-align: center; font-size: 12px; color: var(--muted); margin-top: 18px; }
    @media (max-width: 380px) { .scale { gap: 3px; } .scale button { height: 36px; font-size: 13.5px; } }
  </style>
</head>
<body>
<div class="wrap">
  <div class="head" id="head"></div>
  <div class="card" id="app"><div class="sub">…</div></div>
  <div class="foot" id="foot"></div>
</div>
<script>
(function () {
  var API = 'https://api.kiddietrac.com/api/v1/public/nps/';
  var q = new URLSearchParams(location.search);
  var token = String(q.get('t') || '').replace(/[^A-Za-z0-9]/g, '');
  var pick = q.get('s') !== null && /^(10|[0-9])$/.test(q.get('s')) ? +q.get('s') : null;
  var LOC = 'en', D = null;
  var TR = {
    fr: { 'Survey': 'Sondage', 'QUICK SURVEY': 'SONDAGE RAPIDE', 'How likely are you to recommend {1} to a friend or family member?': 'Quelle est la probabilité que vous recommandiez {1} à un ami ou à un membre de votre famille?', 'How likely are you to recommend {1} as a place to work?': 'Quelle est la probabilité que vous recommandiez {1} comme lieu de travail?', 'Not at all likely': 'Pas du tout probable', 'Extremely likely': 'Extrêmement probable', 'Anything you would like to tell us? (optional)': 'Voulez-vous nous dire quelque chose? (facultatif)', 'Send': 'Envoyer', 'Sending…': 'Envoi…', 'Choose a number from 0 to 10.': 'Choisissez un chiffre de 0 à 10.', 'Thank you!': 'Merci!', 'Your answer was sent to the team. You can change it with this link for 30 days.': 'Votre réponse a été envoyée à l’équipe. Vous pouvez la modifier avec ce lien pendant 30 jours.', 'Change my answer': 'Modifier ma réponse', 'This link can’t be used': 'Ce lien ne peut pas être utilisé', 'This survey link has expired or is not valid.': 'Ce lien de sondage a expiré ou n’est pas valide.', 'This link is not complete. Please open it again from your email.': 'Ce lien est incomplet. Ouvrez-le de nouveau à partir de votre courriel.', 'We could not reach the server. Please check your connection and try again.': 'Nous n’avons pas pu joindre le serveur. Vérifiez votre connexion et réessayez.', 'Hi {1},': 'Bonjour {1},', 'You answered {1}. Pick another number to change it.': 'Vous avez répondu {1}. Choisissez un autre chiffre pour la modifier.' },
    es: { 'Survey': 'Encuesta', 'QUICK SURVEY': 'ENCUESTA RÁPIDA', 'How likely are you to recommend {1} to a friend or family member?': '¿Qué tan probable es que recomiende {1} a un amigo o familiar?', 'How likely are you to recommend {1} as a place to work?': '¿Qué tan probable es que recomiende {1} como lugar de trabajo?', 'Not at all likely': 'Nada probable', 'Extremely likely': 'Muy probable', 'Anything you would like to tell us? (optional)': '¿Algo que quiera decirnos? (opcional)', 'Send': 'Enviar', 'Sending…': 'Enviando…', 'Choose a number from 0 to 10.': 'Elija un número del 0 al 10.', 'Thank you!': '¡Gracias!', 'Your answer was sent to the team. You can change it with this link for 30 days.': 'Su respuesta se envió al equipo. Puede cambiarla con este enlace durante 30 días.', 'Change my answer': 'Cambiar mi respuesta', 'This link can’t be used': 'Este enlace no se puede usar', 'This survey link has expired or is not valid.': 'Este enlace de encuesta venció o no es válido.', 'This link is not complete. Please open it again from your email.': 'Este enlace está incompleto. Ábralo de nuevo desde su correo.', 'We could not reach the server. Please check your connection and try again.': 'No pudimos conectar con el servidor. Revise su conexión e inténtelo de nuevo.', 'Hi {1},': 'Hola, {1}:', 'You answered {1}. Pick another number to change it.': 'Respondió {1}. Elija otro número para cambiarlo.' },
    hi: { 'Survey': 'सर्वेक्षण', 'QUICK SURVEY': 'छोटा सर्वेक्षण', 'How likely are you to recommend {1} to a friend or family member?': 'आप {1} की सिफ़ारिश किसी दोस्त या परिवार के सदस्य से करने की कितनी संभावना रखते हैं?', 'How likely are you to recommend {1} as a place to work?': 'आप {1} को काम करने की जगह के रूप में सुझाने की कितनी संभावना रखते हैं?', 'Not at all likely': 'बिल्कुल संभावना नहीं', 'Extremely likely': 'बहुत ज़्यादा संभावना', 'Anything you would like to tell us? (optional)': 'क्या आप हमें कुछ बताना चाहेंगे? (वैकल्पिक)', 'Send': 'भेजें', 'Sending…': 'भेजा जा रहा है…', 'Choose a number from 0 to 10.': '0 से 10 तक कोई संख्या चुनें।', 'Thank you!': 'धन्यवाद!', 'Your answer was sent to the team. You can change it with this link for 30 days.': 'आपका जवाब टीम को भेज दिया गया। आप 30 दिनों तक इसी लिंक से इसे बदल सकते हैं।', 'Change my answer': 'मेरा जवाब बदलें', 'This link can’t be used': 'यह लिंक इस्तेमाल नहीं हो सकता', 'This survey link has expired or is not valid.': 'इस सर्वेक्षण लिंक की अवधि ख़त्म हो गई है या यह मान्य नहीं है।', 'This link is not complete. Please open it again from your email.': 'यह लिंक अधूरा है। कृपया इसे अपने ईमेल से फिर खोलें।', 'We could not reach the server. Please check your connection and try again.': 'सर्वर तक नहीं पहुँच सके। अपना कनेक्शन जाँचें और फिर कोशिश करें।', 'Hi {1},': 'नमस्ते {1},', 'You answered {1}. Pick another number to change it.': 'आपने {1} जवाब दिया। बदलने के लिए दूसरी संख्या चुनें।' }
  };
  function tr(s, a) { var t = (TR[LOC] && TR[LOC][s]) || s; return a === undefined ? t : t.replace('{1}', a); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  var app = document.getElementById('app');
  function brand(b) {
    b = b || { name: 'KiddieTrac' };
    var hex = String(b.primary || '').replace('#', '');
    if (/^[0-9a-fA-F]{6}$/.test(hex)) {
      var ch = [0, 2, 4].map(function (i) { var v = parseInt(hex.substr(i, 2), 16) / 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); });
      if (0.2126 * ch[0] + 0.7152 * ch[1] + 0.0722 * ch[2] < 0.3) { document.documentElement.style.setProperty('--brand', '#' + hex); }
    }
    var head = document.getElementById('head');
    head.innerHTML = b.logo ? '<img alt="' + esc(b.name) + '">' : '<b>' + esc(b.name) + '</b>';
    if (b.logo) { head.firstChild.src = b.logo; head.firstChild.onerror = function () { head.innerHTML = '<b>' + esc(b.name) + '</b>'; }; }
    var f = document.getElementById('fav');
    if (f) { f.href = b.favicon || (b.white_label ? 'data:,' : '/favicon.svg?v=20260901b'); }
    document.getElementById('foot').textContent = b.name;
    document.title = tr('Survey') + ' · ' + b.name;
  }
  function fail(msg) {
    app.innerHTML = '<div class="done"><div class="big">🔗</div><h1>' + esc(tr('This link can’t be used')) + '</h1><p class="sub">' + esc(tr(msg)) + '</p></div>';
  }
  function paint() {
    var qtext = D.audience === 'staff' ? 'How likely are you to recommend {1} as a place to work?' : 'How likely are you to recommend {1} to a friend or family member?';
    var cur = pick !== null ? pick : (D.answer ? D.answer.score : null);
    var btns = '';
    for (var i = 0; i <= 10; i++) btns += '<button type="button" data-n="' + i + '" class="' + (cur === i ? 'on' : '') + '" aria-pressed="' + (cur === i) + '">' + i + '</button>';
    app.innerHTML = '<div class="eyebrow">' + esc(tr('QUICK SURVEY')) + '</div>'
      + (D.first_name ? '<p class="sub" style="margin:8px 0 0;">' + esc(tr('Hi {1},', D.first_name)) + '</p>' : '')
      + '<h1>' + esc(tr(qtext, D.agency)) + '</h1>'
      + (D.answer && pick === null ? '<p class="sub">' + esc(tr('You answered {1}. Pick another number to change it.', D.answer.score)) + '</p>' : '')
      + '<div class="scale" role="group">' + btns + '</div>'
      + '<div class="ends"><span>0 · ' + esc(tr('Not at all likely')) + '</span><span>10 · ' + esc(tr('Extremely likely')) + '</span></div>'
      + '<label for="cm">' + esc(tr('Anything you would like to tell us? (optional)')) + '</label>'
      + '<textarea id="cm" maxlength="2000">' + esc(D.answer && D.answer.comment || '') + '</textarea>'
      + '<input class="hp" id="website" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">'
      + '<button type="button" class="send" id="send">' + esc(tr('Send')) + '</button><div class="msg" id="msg"></div>';
    app.querySelectorAll('.scale button').forEach(function (b) {
      b.onclick = function () { cur = +b.dataset.n; app.querySelectorAll('.scale button').forEach(function (x) { x.classList.toggle('on', x === b); x.setAttribute('aria-pressed', x === b); }); };
    });
    document.getElementById('send').onclick = function () {
      var msg = document.getElementById('msg');
      if (cur === null) { msg.textContent = tr('Choose a number from 0 to 10.'); return; }
      var btn = this; btn.disabled = true; btn.textContent = tr('Sending…'); msg.textContent = '';
      fetch(API + token, { method: 'POST', headers: { 'Content-Type': 'application/json', Accept: 'application/json' },
        body: JSON.stringify({ score: cur, comment: document.getElementById('cm').value, website: document.getElementById('website').value }) })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (x) {
          if (!x.ok) { btn.disabled = false; btn.textContent = tr('Send'); msg.textContent = tr((x.j && x.j.message) || 'We could not reach the server. Please check your connection and try again.'); return; }
          D.answer = { score: cur, comment: document.getElementById('cm').value }; pick = null;
          app.innerHTML = '<div class="done"><div class="big">💛</div><h1>' + esc(tr('Thank you!')) + '</h1><p class="sub">' + esc(tr('Your answer was sent to the team. You can change it with this link for 30 days.')) + '</p>'
            + '<button type="button" class="send" id="again" style="background:var(--soft);color:var(--ink);border:1px solid var(--line);">' + esc(tr('Change my answer')) + '</button></div>';
          document.getElementById('again').onclick = paint;
        })
        .catch(function () { btn.disabled = false; btn.textContent = tr('Send'); msg.textContent = tr('We could not reach the server. Please check your connection and try again.'); });
    };
  }
  if (token.length < 30) { brand(null); fail('This link is not complete. Please open it again from your email.'); return; }
  fetch(API + token, { headers: { Accept: 'application/json' } })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d && TR[d.locale]) { LOC = d.locale; document.documentElement.lang = d.locale; }
      brand(d && d.brand);
      if (!d || !d.agency) { return fail((d && d.message) || 'This survey link has expired or is not valid.'); }
      D = d; paint();
    })
    .catch(function () { brand(null); fail('We could not reach the server. Please check your connection and try again.'); });
})();
</script>
</body>
</html>
