  <!-- v22p98: ensure EVERY API call carries the active-agency header. Legacy
       per-screen fetch wrappers (certifications, medications, schedule, etc.) omit
       X-Active-Agency-Id; without it, a platform_admin now resolves to "no agency"
       (the iLearn-leak fix) and those screens showed empty. This global fetch
       shim injects the header for all api.kiddietrac.com requests that lack it. -->
  <script>
  (function(){
    if (window.__ktAgencyHeaderShim) return; window.__ktAgencyHeaderShim = true;
    var _fetch = window.fetch;
    window.fetch = function(input, init){
      try {
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        if (url.indexOf('api.kiddietrac.com') !== -1) {
          init = init || {};
          var headers = new Headers(init.headers || (typeof input !== 'string' && input.headers) || {});
          if (!headers.has('X-Active-Agency-Id')) {
            var aid = null; try { aid = sessionStorage.getItem('kt_active_agency_id'); } catch(e){}
            if (aid) headers.set('X-Active-Agency-Id', aid);
          }
          var va = null; try { va = sessionStorage.getItem('kt_view_as'); } catch(e){}
          if (va && !headers.has('X-View-As-Role')) headers.set('X-View-As-Role', va);
          init.headers = headers;
        }
      } catch(e){}
      return _fetch.call(this, input, init);
    };
    // First-login default: a platform_admin sends no X-Active-Agency-Id until
    // one is chosen, which made the first screen error with "no agency access".
    // Seed it from the signed-in user's own agency so the first render works.
    try {
      if (!sessionStorage.getItem('kt_active_agency_id')) {
        var _u = JSON.parse(sessionStorage.getItem('kt_user') || localStorage.getItem('kt_user') || '{}');
        // Prefer the configured default agency (DEFAULT_ADMIN_AGENCY_ID -> the Test
        // Agency). This shim runs BEFORE agency-switcher.js, so seeding it from the
        // admin's OWN agency_id here is what kept dropping a super admin straight
        // into the LIVE agency, looking at real families, no matter what the
        // switcher's default said.
        var _seed = (_u && _u.default_agency_id) ? _u.default_agency_id : (_u && _u.agency_id);
        if (_seed) sessionStorage.setItem('kt_active_agency_id', String(_seed));
      }
    } catch(e){}
  })();
  </script>

<div id="kt-splash"><div class="kt-splash-in"><img class="kt-splash-logo" src="/logo-wordmark-large.png" alt="KiddieTrac"><div class="kt-splash-bar"><span></span></div></div></div>
<style>
#kt-splash{position:fixed;inset:0;z-index:2147483000;display:flex;align-items:center;justify-content:center;background:radial-gradient(125% 72% at 50% 2%,#E7F3FB 0%,#FBFDFF 62%);transition:opacity .5s ease}
#kt-splash.kt-hide{opacity:0;pointer-events:none}
#kt-splash .kt-splash-in{display:flex;flex-direction:column;align-items:center;gap:26px;padding:0 28px}
#kt-splash .kt-splash-logo{width:min(66vw,224px);height:auto;animation:kt-pulse 2.4s ease-in-out infinite}
#kt-splash .kt-splash-bar{width:128px;height:3px;border-radius:99px;background:rgba(20,70,100,.13);overflow:hidden}
#kt-splash .kt-splash-bar span{display:block;width:38%;height:100%;border-radius:99px;background:linear-gradient(90deg,#13B7CC,#8EC73C);animation:kt-load 1.25s ease-in-out infinite}
@keyframes kt-pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.035)}}
@keyframes kt-load{0%{transform:translateX(-130%)}100%{transform:translateX(360%)}}
@media(prefers-reduced-motion:reduce){#kt-splash .kt-splash-logo,#kt-splash .kt-splash-bar span{animation:none}}
</style>
<script>
/* Biometric early re-hydrate — runs BEFORE the deferred app.js. After a
   biometric unlock the app HARD-RELOADS so every module boots authenticated;
   app.js reads the bearer token from sessionStorage, but a WebView reload can
   drop sessionStorage entirely (this is why "unlock then instantly logged out"
   persisted). If we unlocked in the last 30s and the biometric vault (localStorage
   kt_bio_*) is present, restore the session into sessionStorage right here so the
   app boots signed-in. Gated on recency so a cold start still requires biometric. */
(function(){try{
  if(sessionStorage.getItem('kt_token'))return;
  var ua=parseInt(localStorage.getItem('kt_bio_unlocked_at')||'0',10)||0;
  if(!(Date.now()-ua<30000))return;
  var t=localStorage.getItem('kt_bio_token');if(!t)return;
  sessionStorage.setItem('kt_token',t);
  var u=localStorage.getItem('kt_bio_user');if(u)sessionStorage.setItem('kt_user',u);
  var a=localStorage.getItem('kt_bio_agency');if(a)sessionStorage.setItem('kt_active_agency_id',a);
  var v=localStorage.getItem('kt_bio_view');if(v)sessionStorage.setItem('kt_view_as',v);
  var n=String(Date.now());sessionStorage.setItem('kt_login_at',n);sessionStorage.setItem('kt_last_activity',n);
}catch(e){}})();
</script>
<script>
(function(){function hide(){var s=document.getElementById('kt-splash');if(!s)return;s.classList.add('kt-hide');setTimeout(function(){if(s&&s.parentNode)s.parentNode.removeChild(s);},600);}
var MIN=1200,t0=Date.now();function go(){setTimeout(hide,Math.max(0,MIN-(Date.now()-t0)));}
if(document.readyState==='complete')go();else window.addEventListener('load',go);
setTimeout(hide,6000);})();
</script>
