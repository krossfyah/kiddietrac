  <script>(function(){try{var m=(location.hash||'').match(/__demo=([^&]+)/);if(!m)return;var tk=decodeURIComponent(m[1]);var x=new XMLHttpRequest();x.open('GET','https://api.kiddietrac.com/api/v1/auth/me',false);x.setRequestHeader('Authorization','Bearer '+tk);x.setRequestHeader('X-Active-Agency-Id','6');try{x.send(null);}catch(e){}if(x.status===200){var u;try{u=JSON.parse(x.responseText);u=u.user||u;}catch(e){u=null;}if(u){sessionStorage.setItem('kt_token',tk);sessionStorage.setItem('kt_user',JSON.stringify(u));sessionStorage.setItem('kt_active_agency_id','6');try{localStorage.setItem('kt_token',tk);/* NOT localStorage: the active agency belongs to the SESSION, not the device. */localStorage.removeItem('kt_active_agency_id');}catch(e){}}}try{history.replaceState(null,'',location.pathname);}catch(e){}}catch(e){}})();</script>

  <!-- Mark the native Capacitor APK on <html> as EARLY as possible and from the
       document itself (never a cached JS file), so the very first paint already has
       the right chrome. kt-app = the app at any size (safe-area insets and anything
       that genuinely needs to know it is native). kt-native = the app on a PHONE-shaped
       device - the 24 phone rules in kt-mobile-app.css and every isMobile() check read
       this one, so gating it here makes all of them size-aware at a single point.
       kt-mobilenav.js re-applies the same rule and keeps it in sync on rotate. -->
  <script>try{var C=window.Capacitor;var nat=!!(C&&((typeof C.isNativePlatform==='function'&&C.isNativePlatform())||C.isNative||(C.platform&&C.platform!=='web')||(C.Plugins&&C.Plugins.KtBio)));var d=document.documentElement;function ktPhone(){try{var s=window.screen||{},e=(s.width&&s.height)?Math.min(s.width,s.height):(s.width||0);var w=window.innerWidth||0;if(e)return e<=600||(w>0&&w<=768);return w>0?w<=768:true;}catch(x){return true;}}function ktSync(){d.classList.toggle('kt-app',nat);d.classList.toggle('kt-native',nat&&ktPhone());}ktSync();window.__KT_NATIVE=nat;window.__KT_PHONE=ktPhone();window.addEventListener('resize',ktSync);window.addEventListener('orientationchange',ktSync);}catch(e){}</script>
  <!-- Clear a STALE kt_view_as: only a platform_admin can "view as" another role.
       For everyone else a leftover kt_view_as (e.g. from previewing a parent account,
       persisting across logout/login in the same WebView) wrongly overrides their real
       role — it hid the educator clock-in bar and could mis-scope API calls. Drop it
       unless the signed-in user actually holds the platform_admin role. -->
  <script>try{var _u=JSON.parse(sessionStorage.getItem('kt_user')||localStorage.getItem('kt_user')||'{}');var _r=(_u&&_u.roles)||[];if(sessionStorage.getItem('kt_view_as')&&_r.indexOf('platform_admin')===-1){sessionStorage.removeItem('kt_view_as');}}catch(e){}</script>
  <!-- v22p98: ensure EVERY API call carries the active-agency header. Legacy
       per-screen fetch wrappers (certifications, medications, schedule, etc.) omit
       X-Active-Agency-Id; without it, a platform_admin now resolves to "no agency"
       (the iLearn-leak fix) and those screens showed empty. This global fetch
       shim injects the header for all api.kiddietrac.com requests that lack it. -->
  <script>
  (function(){
    if (window.__ktAgencyHeaderShim) return; window.__ktAgencyHeaderShim = true;
    var _fetch = window.fetch;
    window.fetch = function(input, init){
      try {
        var url = typeof input === 'string' ? input : (input && input.url) || '';
        if (url.indexOf('api.kiddietrac.com') !== -1) {
          init = init || {};
          var headers = new Headers(init.headers || (typeof input !== 'string' && input.headers) || {});
          if (!headers.has('X-Active-Agency-Id')) {
            var aid = null; try { aid = sessionStorage.getItem('kt_active_agency_id'); } catch(e){}
            if (aid) headers.set('X-Active-Agency-Id', aid);
          }
          var va = null; try { va = sessionStorage.getItem('kt_view_as'); } catch(e){}
          if (va && !headers.has('X-View-As-Role')) headers.set('X-View-As-Role', va);
          init.headers = headers;
        }
      } catch(e){}
      return _fetch.call(this, input, init);
    };
    // First-login default: a platform_admin sends no X-Active-Agency-Id until
    // one is chosen, which made the first screen error with "no agency access".
    // Seed it from the signed-in user's own agency so the first render works.
    try {
      if (!sessionStorage.getItem('kt_active_agency_id')) {
        var _u = JSON.parse(sessionStorage.getItem('kt_user') || localStorage.getItem('kt_user') || '{}');
        // Prefer the configured default agency (DEFAULT_ADMIN_AGENCY_ID -> the Test
        // Agency). This shim runs BEFORE agency-switcher.js, so seeding it from the
        // admin's OWN agency_id here is what kept dropping a super admin straight
        // into the LIVE agency, looking at real families, no matter what the
        // switcher's default said.
        var _seed = (_u && _u.default_agency_id) ? _u.default_agency_id : (_u && _u.agency_id);
        if (_seed) sessionStorage.setItem('kt_active_agency_id', String(_seed));
      }
    } catch(e){}
  })();
  </script>

<!-- ── Signed-out launch: leave immediately ──────────────────────────────────
     The APK opens dashboard.html. With no session this page only exists to bounce
     to the login form, but the shell still painted first — the wordmark header,
     a spinner and "Loading your workspace…", which is not a launch experience.
     This runs BEFORE any of that: it paints a plain navy cover with the app icon
     and redirects, so a cold launch reads as navy splash -> login and nothing else.
     Must stay inline and first; a deferred script is far too late. -->
<script>
(function () {
  try {
    var t = null;
    try { t = sessionStorage.getItem('kt_token') || localStorage.getItem('kt_token'); } catch (e) {}
    if (t) return;                                  // signed in: normal boot
    var h = (location.hash || '');
    if (h.indexOf('__demo=') !== -1 || h.indexOf('kt_sso=') !== -1) return;   // token handoff in the URL
    document.documentElement.style.background = '#081C41';
    var cover = document.createElement('div');
    cover.setAttribute('style',
      'position:fixed;inset:0;z-index:2147483600;background:#081C41;display:flex;'
      + 'align-items:center;justify-content:center;');
    cover.innerHTML = '<img src="/icon-192.png" alt="" style="width:104px;height:104px;border-radius:24px;"'
      + ' onerror="this.style.display=\'none\'">';
    (document.body || document.documentElement).appendChild(cover);
    location.replace('/index.html');
  } catch (e) {}
})();
</script>

<script>
/* Biometric early re-hydrate — runs BEFORE the deferred app.js. After a
   biometric unlock the app HARD-RELOADS so every module boots authenticated;
   app.js reads the bearer token from sessionStorage, but a WebView reload can
   drop sessionStorage entirely (this is why "unlock then instantly logged out"
   persisted). If we unlocked in the last 30s and the biometric vault (localStorage
   kt_bio_*) is present, restore the session into sessionStorage right here so the
   app boots signed-in. Gated on recency so a cold start still requires biometric. */
(function(){try{
  if(sessionStorage.getItem('kt_token'))return;
  var ua=parseInt(localStorage.getItem('kt_bio_unlocked_at')||'0',10)||0;
  if(!(Date.now()-ua<30000))return;
  var t=localStorage.getItem('kt_bio_token');if(!t)return;
  sessionStorage.setItem('kt_token',t);
  var u=localStorage.getItem('kt_bio_user');if(u)sessionStorage.setItem('kt_user',u);
  var a=localStorage.getItem('kt_bio_agency');if(a)sessionStorage.setItem('kt_active_agency_id',a);
  var v=localStorage.getItem('kt_bio_view');if(v)sessionStorage.setItem('kt_view_as',v);
  var n=String(Date.now());sessionStorage.setItem('kt_login_at',n);sessionStorage.setItem('kt_last_activity',n);
}catch(e){}})();
</script>
<script>
(function(){

try{var C=window.Capacitor;if(C&&C.Plugins&&C.Plugins.SplashScreen)C.Plugins.SplashScreen.hide();}catch(e){}

   reload (which fires whenever a deploy bumps the SW cache) re-runs this page — without
   this guard the 2.3s splash replays on that reload, which is the APK's "loads 3x".
   sessionStorage survives the in-session reload but clears on a genuine app relaunch,
   so a real launch still gets exactly one splash. */
var _seen;try{_seen=sessionStorage.getItem('kt_splash_seen')==='1';}catch(e){_seen=false;}
try{sessionStorage.setItem('kt_splash_seen','1');}catch(e){}
/* No session? Then this page is about to bounce to the login form, and there is no
   portal to wait for — drop the splash instantly so launching the app lands on the
   login page with no boot sequence in front of it. */
var _hasSession=false;try{_hasSession=!!(sessionStorage.getItem('kt_token')||localStorage.getItem('kt_token'));}catch(e){_hasSession=false;}
if(!_hasSession){var _ns=document.getElementById('kt-splash');if(_ns&&_ns.parentNode)_ns.parentNode.removeChild(_ns);}
else if(_seen){var _s=document.getElementById('kt-splash');if(_s)_s.style.display='none';showReloadGate();}
else{
/* Hold the splash until a screen is really on the page. window 'load' only means the
   ~160 scripts downloaded; the SPA still has to boot, call /auth/me, resolve the role
   and render. During that gap #appMain shows its .loading-state placeholder - the light
   shell with "Loading your workspace..." that kept being reported after a FIRST login,
   when nothing is warm and every boot call is a cold round trip.
   portalReady() therefore waits for the placeholder to be REPLACED by real content, with
   a hard cap so a failed boot can never trap anyone behind the splash. */
var MIN=2300,CAP=15000,t0=Date.now();
function portalReady(){
  try{
    var m=document.getElementById('appMain');
    if(!m) return false;
    if(m.querySelector('.loading-state')) return false;      // placeholder still up
    return (m.innerText||'').trim().length>40;                // a screen actually drew
  }catch(e){ return true; }                                   // never trap on an error
}
function settle(){
  var waited=Date.now()-t0;
  if(waited<MIN) return setTimeout(settle,120);               // minimum brand moment
  if(portalReady()||waited>CAP) return hide();

   but still GATE the portal behind a dimmed scrim + spinner so the user never sees a
   half-rendered/unstyled portal or interacts before it is ready. Removed once the page
   has fully loaded (window 'load' + a short settle), hard-capped so it can never trap. */
function showReloadGate(){
  var ov=document.createElement('div');ov.id='kt-reload-gate';
  ov.setAttribute('data-no-modal-guard','1');
