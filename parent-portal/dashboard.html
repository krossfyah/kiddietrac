       only, the tag says "light dark" while every colour stays our light one (html background/text and form

     to the login form, but the shell still painted first — the wordmark header,

   login page with no boot sequence in front of it. */

           service-worker.js bytes, in which case the new version never activates and
           this tab runs old code forever. So compare what the SERVER serves against
           what this page is RUNNING — the only two things that must agree. */
        (function () {
          function runningVersion() {
            var el = document.querySelector('script[src*="screen-chat"]');
            var m = el && (el.getAttribute('src') || '').match(/[?&]v=([^&"']+)/);
            return m ? m[1] : null;
          }
          var mine = runningVersion();
          if (!mine) { return; }          // nothing to compare against

          function busy() {
            // Never interrupt someone mid-sentence, or with something open.
            var a = document.activeElement;
            if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { return true; }
            if (a && a.isContentEditable) { return true; }
            var typed = [].slice.call(document.querySelectorAll('input,textarea'))
              .some(function (i) { return (i.value || '').trim() !== ''; });
            if (typed) { return true; }
            if (document.querySelector('.kt-modal,[role="dialog"],#kt-chat-dock:not([style*="display: none"])')) { return true; }
            if (window.KT_mediaBusy && window.KT_mediaBusy()) { return true; }   // watching a clip (ticket #223)

          function check() {
            if (checking || document.hidden) { return; }
            checking = true;
            fetch('/dashboard.html?_v=' + Date.now(), { cache: 'reload' })
              .then(function (r) { return r.text(); })
              .then(function (html) {
                var m = html.match(/screen-chat\.js\?v=([^&"']+)/);
                var live = m ? m[1] : null;
                if (!live || live === mine) { return; }
                // A new build is deployed and this tab is running the old one.
                if (busy()) { return; }   // try again on the next tick
                location.reload();
              })
              .catch(function () {})
              .then(function () { checking = false; });
